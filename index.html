<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuisCheats • Flick FPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0a0a0a;
  color:#e0e0e0;
  font-family:'Roboto Mono',monospace;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 50%, rgba(180,0,30,0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(180,0,30,0.06) 0%, transparent 50%);
}

header{
  background:linear-gradient(to bottom,#110000,#0a0a0a);
  border-bottom:1px solid #ff003322;
  padding:1.2rem 5%;
}

nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:'Orbitron',sans-serif;
  font-size:2rem;
  color:#ff1a1a;
  letter-spacing:2px;
  text-shadow:0 0 20px #ff0044aa;
}

main{
  max-width:900px;
  margin:4rem auto;
  padding:0 5%;
  text-align:center;
}

h1{
  font-family:'Orbitron',sans-serif;
  font-size:3.5rem;
  color:#ff0033;
  text-shadow:0 0 40px #ff004488;
  margin-bottom:.6rem;
}

.subtitle{
  color:#888;
  margin-bottom:3rem;
}

.card{
  max-width:420px;
  margin:auto;
  background:#111;
  border:1px solid #330000;
  border-radius:14px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#ff1a1a77;
  box-shadow:0 20px 40px #000000aa,0 0 30px #ff004433;
}

.card-top{
  height:150px;
  background:linear-gradient(135deg,#1a0000,#220000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:3.2rem;
  font-family:'Orbitron',sans-serif;
  color:#ff333366;
}

.card-content{
  padding:1.6rem;
}

.card h3{
  color:#ff4444;
  font-size:1.5rem;
  margin-bottom:.6rem;
}

.status{
  display:inline-block;
  background:#1a3300;
  color:#88ff88;
  padding:.3rem .8rem;
  border-radius:14px;
  font-size:.78rem;
  margin-bottom:1rem;
}

.card p{
  color:#aaa;
  font-size:.95rem;
  margin-bottom:1.4rem;
}

.btn{
  background:#c00;
  color:#fff;
  padding:.75rem 1.6rem;
  border-radius:6px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  background:#ff1a1a;
  box-shadow:0 8px 20px #c0000044;
}

.btn.copied{
  background:#2ecc71;
  color:#000;
}

/* LOGO CIRCULAR */
.logo-circle{
  position:fixed;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #ff1a1a;
  box-shadow:0 0 20px #ff0044aa;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  transition:transform .2s;
}

.logo-circle img{
  max-width:100%;
  max-height:100%;
  object-fit:cover;
}

.logo-circle:hover{
  transform:scale(1.1);
}

@media (max-width:600px){
  h1{font-size:2.8rem}
  .logo-circle{width:50px;height:50px;top:15px;right:15px}
}
</style>
</head>

<body>

<header>
  <nav>
    <div class="logo">LuisCheats</div>
  </nav>
</header>

<!-- Logo circular -->
<div class="logo-circle">
  <img src="https://files.catbox.moe/75fuzo.jpg" alt="Logo">
</div>

<main>
<h1>Flick FPS</h1>
<p class="subtitle">Optimization • Speed • Legit Performance</p>

<div class="card">
  <div class="card-top">FPS</div>
  <div class="card-content">
    <h3>Flick FPS Script</h3>
    <div class="status">Undetected • 2026</div>
    <p>Aimbot • Legit smooth • FOV based • Prediction • Performance optimized</p>
    <button class="btn" id="copyBtn" onclick="copyScript()">Copy Script</button>
  </div>
</div>
</main>

<script>
const flickScript = `loadstring(game:HttpGet("https://raw.githubusercontent.com/LuisCheats/FlickFPS/main/FlickFPS.lua"))()`;

function copyScript(){
  navigator.clipboard.writeText(flickScript);
  const btn = document.getElementById("copyBtn");
  btn.classList.add("copied");
  btn.textContent = "Copied ✓";
  setTimeout(()=>{
    btn.classList.remove("copied");
    btn.textContent = "Copy Script";
  },1800);
}
</script>

</body>
</html>
